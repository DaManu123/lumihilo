name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobación de tipos (typecheck)
        run: npm run typecheck

      - name: Ejecutar pruebas unitarias (test)
        run: npm test

      - name: Compilación para producción (build)
        run: npm run build
